apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-text
          emptyDir: {}
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-text
              mountPath: /usr/src/app/files
        - name: backend
          image: backend:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-text
              mountPath: /usr/src/app/files