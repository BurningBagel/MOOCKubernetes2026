apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: wikipedia-todo
              image: curlimages/curl
              command:
                - /bin/sh
                - -c
                - |
                  URL=$(curl -Ls -o /dev/null -w '%{url_effective}' https://en.wikipedia.org/wiki/Special:Random)

                  echo "Random Wikipedia article: $URL"

                  curl -X POST http://todo-backend-svc:2345/todos \
                    -H 'Content-Type: application/json' \
                    -d "{\"todo\":\"Read $URL\"}"