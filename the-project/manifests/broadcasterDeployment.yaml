apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: broadcaster:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: the-project-config-map
          env:
          - name: PORT
            value: "3000"
            
          
