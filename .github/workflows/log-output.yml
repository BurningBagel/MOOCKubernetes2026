name: Release log-output

on:
  push:
    branches: [main]
    paths:
      - "log-output-with-ping-pong/**"
      - ".github/workflows/log-output.yml"

permissions:
  contents: write

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker build -t burningbagel/frontend:$GITHUB_SHA log-output-with-ping-pong/log-output/frontend
          docker push burningbagel/frontend:$GITHUB_SHA

          docker build -t burningbagel/backend:$GITHUB_SHA log-output-with-ping-pong/log-output/backend
          docker push burningbagel/backend:$GITHUB_SHA

          docker build -t burningbagel/ping-pong:$GITHUB_SHA log-output-with-ping-pong/ping-pong
          docker push burningbagel/ping-pong:$GITHUB_SHA

      - uses: imranismail/setup-kustomize@v3

      - name: Update deployed image tags
        working-directory: log-output-with-ping-pong
        run: |
          kustomize edit set image \
            frontend=burningbagel/frontend:$GITHUB_SHA \
            backend=burningbagel/backend:$GITHUB_SHA \
            ping-pong=burningbagel/ping-pong:$GITHUB_SHA

      - uses: EndBug/add-and-commit@v10
        with:
          add: "log-output-with-ping-pong/kustomization.yaml"
          message: "Release log-output ${{ github.sha }}"
