name: Release the-project

on:
  push:
    branches: [main]
    paths:
      - "the-project/**"
      - ".github/workflows/the-project.yaml"

permissions:
  contents: write

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker build -t burningbagel/the-project-frontend:$GITHUB_SHA the-project/the-project-frontend
          docker push burningbagel/the-project-frontend:$GITHUB_SHA

          docker build -t burningbagel/the-project-backend:$GITHUB_SHA the-project/the-project-backend
          docker push burningbagel/the-project-backend:$GITHUB_SHA

          docker build -t burningbagel/todo-backend:$GITHUB_SHA the-project/todo-backend
          docker push burningbagel/todo-backend:$GITHUB_SHA

      - uses: imranismail/setup-kustomize@v3

      - name: Update deployed image tags
        working-directory: the-project
        run: |
          kustomize edit set image \
            the-project-frontend=burningbagel/the-project-frontend:$GITHUB_SHA \
            the-project-backend=burningbagel/the-project-backend:$GITHUB_SHA \
            todo-backend=burningbagel/todo-backend:$GITHUB_SHA

      - uses: EndBug/add-and-commit@v10
        with:
          add: "the-project/kustomization.yaml"
          message: "Release the-project ${{ github.sha }}"
